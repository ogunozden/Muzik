name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"
      - run: npm ci
      - run: npm run guardrails:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run audit:bundle-size
      - run: npm run audit:security
      # E2E (E5/F6.3): kritik akislar gercek tarayicida. webServer config'i CI'da
      # (reuseExistingServer=false) taze `next dev` baslatir; PLAYWRIGHT_BASE_URL
      # verilmez. Chromium runner'a kurulur.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
